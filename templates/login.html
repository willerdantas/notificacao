{% extends "base.html" %}
{% block title %}Login | Sistema de Notificação{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-box">
    <img class="hospital-logo login-logo" src="{{ logo_principal_url }}" alt="Logo do sistema">
    <h2>Acesso ao Sistema</h2>
    <p>Informe suas credenciais para continuar</p>

    <form method="POST" action="{{ url_for('auth.login') }}" data-transition="true">
      <div class="field">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-secondary" style="width:100%;">Entrar</button>
    </form>

  </div>
</div>
{% endblock %}
