{% extends "base.html" %}
{% block title %}Editar Setor{% endblock %}

{% block content %}
<div class="page-header">
  <div class="title">
    <h2>Editar Setor</h2>
    <p>Atualize o nome do setor cadastrado</p>
  </div>
</div>

<div class="container">
  <div class="panel">
    <h3 style="margin-top:0; color:var(--green-dark);">{{ setor.nome }}</h3>
    <form method="POST" action="{{ url_for('main.editar_setor', setor_id=setor.id) }}" data-transition="false">
      <div class="form-grid">
        <div class="field">
          <label for="nome_setor">Nome do Setor *</label>
          <input type="text" id="nome_setor" name="nome_setor" value="{{ setor.nome }}" required>
        </div>
      </div>
      <div style="margin-top:20px; text-align:right;">
        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
